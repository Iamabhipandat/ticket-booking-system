# Application
spring.application.name=ticket-booking
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticket_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TuY1IRt7qnoqCg}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:nLONoj5NOqiJQCTH8VWtihSo}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:ticket_booking_webhook_secret_key_12345}

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL (CORS & Verification Links)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
